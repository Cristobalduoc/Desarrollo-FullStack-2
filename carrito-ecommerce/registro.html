<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario | Front-End</title>
</head>
<body>

    <!-- Encabezado con Menú de Navegación -->
    <header>
        <h1>Front-End</h1>
        <p>Componentes de Robótica y Automatización</p>
        
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito (<span id="cant-carrito">0</span>)</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenido Principal: Formulario de Registro de Cliente -->
    <main>
        <section>
            <h2>Registro de Nuevo Cliente</h2>
            <form id="form-registro">
                <div>
                    <label for="reg-rut">RUT:</label>
                    <input type="text" id="reg-rut" placeholder="12345678-9" required>
                </div>
                <div>
                    <label for="reg-nombre">Nombre:</label>
                    <input type="text" id="reg-nombre" required>
                </div>
                <div>
                    <label for="reg-apellido">Apellido:</label>
                    <input type="text" id="reg-apellido" required>
                </div>
                <div>
                    <label for="reg-correo">Correo electrónico:</label>
                    <input type="email" id="reg-correo" required>
                </div>
                <div>
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div>
                    <label for="reg-telefono">Teléfono (Opcional):</label>
                    <input type="tel" id="reg-telefono">
                </div>
                <div>
                    <label for="reg-region">Región:</label>
                    <input type="text" id="reg-region" required>
                </div>
                <div>
                    <label for="reg-comuna">Comuna:</label>
                    <input type="text" id="reg-comuna" required>
                </div>
                <div>
                    <label for="reg-direccion">Dirección (Opcional):</label>
                    <input type="text" id="reg-direccion">
                </div>
                <button type="submit">Crear Cuenta</button>
            </form>

            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>.</p>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Front-End Electrónica</p>
    </footer>
<script src="js/validaciones.js"></script>
<script src="js/app.js"></script>

</body>
</html>
