</head>
<body>

    <!-- Encabezado con Menú de Navegación -->
    <header>
        <h1>Front-End</h1>
        <p>Componentes de Robótica y Automatización</p>
        
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>

            </ul>
        </nav>
    </header>

    <!-- Contenido Principal: Formulario de Contacto -->
    <main>
        <section>
            <h2>Contáctanos</h2>
            <p>¿Tienes dudas sobre algún componente o tu pedido? Envíanos un mensaje.</p>

            <form id="form-contacto">
                <div>
                    <label for="contacto-nombre">Nombre:</label>
                    <input type="text" id="contacto-nombre" required>
                </div>
                <div>
                    <label for="contacto-correo">Correo electrónico:</label>
                    <input type="email" id="contacto-correo" required>
                </div>
                <div>
                    <label for="contacto-mensaje">Mensaje:</label>
                    <textarea id="contacto-mensaje" rows="4" required></textarea>
                </div>
                <button type="submit">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 Front-End Electrónica</p>
    </footer>
<script src="js/validaciones.js"></script>

</body>
