<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrontEnd - Tienda</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <h1>FrontEnd</h1>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="adminNav" style="display:none"><a href="admin/dashboard.html">Admin</a></li>
            </ul>
            <div class="nav-right">
                <a href="carrito.html">🛒 <span id="cartCount">0</span></a>
                <button id="btnSesion" onclick="abrirLogin()">Iniciar Sesión</button>
                <button id="btnCerrar" onclick="cerrarSesion()" style="display:none">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Modal Login -->
    <div id="modalLogin" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="cerrarLogin()">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form id="formLogin" onsubmit="hacerLogin(event)">
                <input type="text" id="rutLogin" placeholder="RUT (ej: 12345678-9)" required>
                <input type="password" id="passLogin" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <p>¿No tienes cuenta? <button type="button" onclick="cambiarRegistro()">Registrarse</button></p>
        </div>
    </div>

    <!-- Modal Registro -->
    <div id="modalRegistro" class="modal" style="display:none">
        <div class="modal-content">
            <span class="close" onclick="cerrarRegistro()">&times;</span>
            <h2>Crear Cuenta</h2>
            <form id="formRegistro" onsubmit="hacerRegistro(event)">
                <input type="text" id="rutReg" placeholder="RUT (ej: 12345678-9)" required>
                <input type="text" id="nombreReg" placeholder="Nombre" required>
                <input type="text" id="apellidoReg" placeholder="Apellido" required>
                <input type="email" id="emailReg" placeholder="Correo" required>
                <input type="password" id="passReg" placeholder="Contraseña" required>
                <input type="text" id="telefonoReg" placeholder="Teléfono (Opcional)">
                <select id="regionReg" required>
                    <option value="">Seleccionar Región</option>
                    <option value="Arica">Arica y Parinacota</option>
                    <option value="Tarapacá">Tarapacá</option>
                    <option value="Antofagasta">Antofagasta</option>
                    <option value="Atacama">Atacama</option>
                    <option value="Coquimbo">Coquimbo</option>
                    <option value="Valparaíso">Valparaíso</option>
                    <option value="OHiggins">O'Higgins</option>
                    <option value="Maule">Maule</option>
                    <option value="Nuble">Ñuble</option>
                    <option value="Biobio">Biobío</option>
                    <option value="Araucanía">Araucanía</option>
                    <option value="LosRios">Los Ríos</option>
                    <option value="LosLagos">Los Lagos</option>
                    <option value="Aysen">Aysén</option>
                    <option value="Magallanes">Magallanes</option>
                    <option value="Metropolitana">Metropolitana</option>
                </select>
                <input type="text" id="comunaReg" placeholder="Comuna" required>
                <input type="text" id="direccionReg" placeholder="Dirección (Opcional)">
                <button type="submit">Registrarse</button>
            </form>
            <p><button type="button" onclick="cambiarLogin()">Volver a Iniciar Sesión</button></p>
        </div>
    </div>

    <main id="content"></main>

    <footer>
        <p>&copy; 2024 FrontEnd - Tienda de Electrónica</p>
    </footer>

    <script src="../js/validaciones.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
